<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin | AB Promoters and Developers</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .upload-box{border:1px dashed #c8a95b;border-radius:12px;padding:16px;margin:10px 0 16px;background:#fffaf0}
    .upload-box label{display:block;font-weight:700;margin-bottom:8px}
    .upload-help{font-size:13px;color:#666;margin:6px 0 10px}
    #imagePreview{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
    #imagePreview img{width:100%;height:90px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
    .upload-status{font-size:14px;margin:8px 0}
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap nav">
      <a class="brand" href="index.html">AB <span>Promoters & Developers</span></a>
      <nav><a href="properties.html">Public Listings</a></nav>
    </div>
  </header>

  <main class="wrap section">
    <p class="eyebrow">PRIVATE ADMIN AREA</p>
    <h1>Property Management</h1>

    <div id="login">
      <p>Sign in with your Supabase admin account.</p>
      <input id="email" type="email" placeholder="Admin email">
      <input id="password" type="password" placeholder="Password">
      <button class="btn" id="loginBtn" type="button">Sign in</button>
      <p id="msg" class="muted"></p>
    </div>

    <div id="panel" hidden>
      <h2>Add Property</h2>
      <form id="form">
        <input name="title" placeholder="Property title" required>

        <select name="property_type" required>
          <option value="">Property type</option>
          <option value="plots">Plots</option>
          <option value="houses">Houses</option>
          <option value="flats">Flats & Apartments</option>
          <option value="villas">Villas</option>
          <option value="commercial">Commercial</option>
          <option value="rentals">Rentals</option>
          <option value="farm_lands">Farm Lands</option>
          <option value="agricultural_lands">Agricultural Lands</option>
        </select>

        <select name="location" required>
          <option value="">Location</option>
          <option>Chennai</option>
          <option>Kanchipuram</option>
          <option>Chengalpattu</option>
          <option>Tiruvallur</option>
          <option>Tindivanam</option>
        </select>

        <input name="area" placeholder="Area e.g. 1200 sq.ft">
        <input name="price" placeholder="Price">

        <div class="upload-box">
          <label for="images">Property images</label>
          <input id="images" name="images" type="file" accept="image/*" multiple>
          <p class="upload-help">Select multiple JPG, PNG or WebP images. Maximum 8 images, up to 10 MB each.</p>
          <div id="imagePreview"></div>
          <p id="uploadStatus" class="upload-status muted"></p>
        </div>

        <textarea name="description" placeholder="Description"></textarea>
        <label><input type="checkbox" name="featured"> Featured property</label>
        <button class="btn" id="publishBtn" type="submit">Publish property</button>
      </form>

      <p id="result" class="muted"></p>
      <button class="btn ghost" id="logout" type="button">Sign out</button>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const login = document.querySelector('#login');
    const panel = document.querySelector('#panel');
    const msg = document.querySelector('#msg');
    const form = document.querySelector('#form');
    const imageInput = document.querySelector('#images');
    const imagePreview = document.querySelector('#imagePreview');
    const uploadStatus = document.querySelector('#uploadStatus');
    const result = document.querySelector('#result');
    const publishBtn = document.querySelector('#publishBtn');

    const MAX_IMAGES = 8;
    const MAX_FILE_SIZE = 10 * 1024 * 1024;
    const IMAGE_BUCKET = 'property-images';

    function slugify(value) {
      return value.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    imageInput.addEventListener('change', () => {
      imagePreview.innerHTML = '';
      uploadStatus.textContent = '';
      const files = Array.from(imageInput.files || []);

      if (files.length > MAX_IMAGES) {
        uploadStatus.textContent = `Please select a maximum of ${MAX_IMAGES} images.`;
        imageInput.value = '';
        return;
      }

      for (const file of files) {
        if (!file.type.startsWith('image/')) {
          uploadStatus.textContent = 'Only image files are allowed.';
          imageInput.value = '';
          imagePreview.innerHTML = '';
          return;
        }
        if (file.size > MAX_FILE_SIZE) {
          uploadStatus.textContent = `${file.name} is larger than 10 MB.`;
          imageInput.value = '';
          imagePreview.innerHTML = '';
          return;
        }

        const img = document.createElement('img');
        img.alt = file.name;
        img.src = URL.createObjectURL(file);
        imagePreview.appendChild(img);
      }

      uploadStatus.textContent = files.length ? `${files.length} image(s) selected.` : '';
    });

    async function state() {
      const { data } = await sb.auth.getSession();
      login.hidden = !!data.session;
      panel.hidden = !data.session;
    }

    document.querySelector('#loginBtn').onclick = async () => {
      const email = document.querySelector('#email').value.trim();
      const password = document.querySelector('#password').value;
      msg.textContent = 'Signing in...';
      const { error } = await sb.auth.signInWithPassword({ email, password });
      msg.textContent = error ? error.message : 'Signed in';
      await state();
    };

    document.querySelector('#logout').onclick = async () => {
      await sb.auth.signOut();
      await state();
    };

    form.onsubmit = async (e) => {
      e.preventDefault();
      result.textContent = '';
      uploadStatus.textContent = '';
      publishBtn.disabled = true;
      publishBtn.textContent = 'Publishing...';

      const files = Array.from(imageInput.files || []);
      const f = new FormData(form);
      const title = String(f.get('title') || '').trim();
      const slug = slugify(title);
      const uploadedPaths = [];

      try {
        if (!files.length) {
          throw new Error('Please select at least one property image.');
        }
        if (files.length > MAX_IMAGES) {
          throw new Error(`Please select a maximum of ${MAX_IMAGES} images.`);
        }

        const imageUrls = [];

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          uploadStatus.textContent = `Uploading image ${i + 1} of ${files.length}...`;
          const safeName = file.name.toLowerCase().replace(/[^a-z0-9._-]+/g, '-');
          const path = `${slug}/${crypto.randomUUID()}-${safeName}`;

          const { data, error: uploadError } = await sb.storage
            .from(IMAGE_BUCKET)
            .upload(path, file, {
              cacheControl: '31536000',
              contentType: file.type,
              upsert: false
            });

          if (uploadError) throw uploadError;
          uploadedPaths.push(data.path);

          const { data: publicData } = sb.storage.from(IMAGE_BUCKET).getPublicUrl(data.path);
          imageUrls.push(publicData.publicUrl);
        }

        uploadStatus.textContent = 'Saving property details...';

        const row = {
          title,
          slug,
          property_type: f.get('property_type'),
          location: f.get('location'),
          area: f.get('area'),
          price: f.get('price'),
          description: f.get('description'),
          featured: f.get('featured') === 'on',
          image_urls: imageUrls
        };

        const { error } = await sb.from('properties').insert(row);
        if (error) {
          await sb.storage.from(IMAGE_BUCKET).remove(uploadedPaths);
          throw error;
        }

        result.textContent = 'Property published successfully with images.';
        uploadStatus.textContent = `${imageUrls.length} image(s) uploaded successfully.`;
        form.reset();
        imagePreview.innerHTML = '';
      } catch (error) {
        console.error(error);
        result.textContent = error.message || 'Unable to publish property.';
        uploadStatus.textContent = 'Upload failed. Please try again.';
      } finally {
        publishBtn.disabled = false;
        publishBtn.textContent = 'Publish property';
      }
    };

    state();
  </script>
</body>
</html>
