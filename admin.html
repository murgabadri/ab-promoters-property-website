<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | AB Promoters and Developers</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">AB <span>Promoters & Developers</span></a><nav><a href="properties.html">Public Listings</a></nav></div></header><main class="wrap section"><p class="eyebrow">PRIVATE ADMIN AREA</p><h1>Property Management</h1><div id="login"><p>Sign in with your Supabase admin account.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="btn" id="loginBtn">Sign in</button><p id="msg" class="muted"></p></div><div id="panel" hidden><h2>Add Property</h2><form id="form"><input name="title" placeholder="Property title" required><select name="property_type" required><option value="">Property type</option><option value="plots">Plots</option><option value="houses">Houses</option><option value="flats">Flats & Apartments</option><option value="villas">Villas</option><option value="commercial">Commercial</option><option value="rentals">Rentals</option><option value="farm_lands">Farm Lands</option><option value="agricultural_lands">Agricultural Lands</option></select><select name="location" required><option value="">Location</option><option>Chennai</option><option>Kanchipuram</option><option>Chengalpattu</option><option>Tiruvallur</option><option>Tindivanam</option></select><input name="area" placeholder="Area e.g. 1200 sq.ft"><input name="price" placeholder="Price"><input name="image" placeholder="Image URL"><textarea name="description" placeholder="Description"></textarea><label><input type="checkbox" name="featured"> Featured property</label><button class="btn">Publish property</button></form><p id="result" class="muted"></p><button class="btn ghost" id="logout">Sign out</button></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const login=document.querySelector('#login'),panel=document.querySelector('#panel'),msg=document.querySelector('#msg');async function state(){const {data}=await sb.auth.getSession();login.hidden=!!data.session;panel.hidden=!data.session}document.querySelector('#loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});msg.textContent=error?error.message:'Signed in';state()};document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();state()};document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),title=f.get('title'),slug=title.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');const row={title,slug,property_type:f.get('property_type'),location:f.get('location'),area:f.get('area'),price:f.get('price'),description:f.get('description'),featured:f.get('featured')==='on',image_urls:f.get('image')?[f.get('image')]:[]};const {error}=await sb.from('properties').insert(row);result.textContent=error?error.message:'Property published successfully.';if(!error)e.target.reset()};state();</script></body></html>
