<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell Your Property | AB Promoters and Developers</title><meta name="description" content="Submit your property details to AB Promoters and Developers in Chennai, Kanchipuram, Chengalpattu, Tiruvallur or Tindivanam."><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">AB <span>Promoters & Developers</span></a></div></header><main class="wrap section"><p class="eyebrow">SELL YOUR PROPERTY</p><h1>Let’s discuss your property</h1><p class="lead">Submit your property details and our team will contact you.</p><form id="sellerForm"><input name="name" placeholder="Your name" required><input name="phone" type="tel" placeholder="Contact number" required><input name="email" type="email" placeholder="Email address"><select name="property_type"><option value="">Property type</option><option>Plot</option><option>House</option><option>Flat / Apartment</option><option>Villa</option><option>Commercial Property</option><option>Farm Land</option><option>Agricultural Land</option><option>Other</option></select><select name="location"><option value="">Property location</option><option>Chennai</option><option>Kanchipuram</option><option>Chengalpattu</option><option>Tiruvallur</option><option>Tindivanam</option><option>Other</option></select><input name="expected_price" placeholder="Expected price"><textarea name="property_details" placeholder="Property details: area, address, road access, documents, etc."></textarea><button class="btn" id="submitBtn" type="submit">Submit Property Details</button><p id="result" class="muted"></p></form><p class="section">Prefer to speak directly? Call <b>9786619196</b> or <b>7904473899</b><br>Email: badrinarayanandkgb@gmail.com</p></main><footer><div class="wrap footer"><strong>AB Promoters and Developers</strong><span>Chengalpattu, Tamil Nadu</span></div></footer><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);document.querySelector('#sellerForm').onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('#submitBtn'),result=document.querySelector('#result');btn.disabled=true;btn.textContent='Submitting...';const f=new FormData(e.target);const row=Object.fromEntries(f.entries());const {error}=await sb.from('seller_leads').insert(row);if(error){result.textContent='Unable to submit right now. Please call us directly.';console.error(error)}else{result.textContent='Thank you! Your property details have been submitted. Our team will contact you soon.';e.target.reset()}btn.disabled=false;btn.textContent='Submit Property Details'};</script></body></html>
