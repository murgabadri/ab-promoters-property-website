<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Leads | AB Promoters and Developers</title><link rel="stylesheet" href="styles.css"><style>.lead-card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}.lead-top{display:flex;justify-content:space-between;gap:12px}.lead-meta{color:#666;font-size:14px;margin:6px 0}.filters{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:16px 0}.seller-images{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:12px 0}.seller-images img{width:100%;height:110px;object-fit:cover;border-radius:9px;border:1px solid #ddd}.filters input,.filters select{width:100%}@media(max-width:600px){.filters{grid-template-columns:1fr}}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">AB <span>Promoters & Developers</span></a><nav><a href="admin.html">Admin</a></nav></div></header><main class="wrap section"><p class="eyebrow">SELLER ENQUIRIES</p><h1>Property Seller Leads</h1><p class="lead">Customers who submit the Sell Your Property form will appear here.</p><div id="login"><p>Sign in with your Supabase admin account.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="btn" id="loginBtn" type="button">Sign in</button><p id="msg" class="muted"></p></div><div id="panel" hidden><div class="actions"><button class="btn" id="refresh" type="button">Refresh leads</button><a class="btn ghost" href="admin.html">Back to Admin</a></div><div class="filters"><input id="search" placeholder="Search name, phone, location..."><select id="statusFilter"><option value="">All statuses</option><option>New</option><option>Contacted</option><option>Interested</option><option>Site Visit</option><option>Closed</option><option>Not Interested</option></select></div><div id="leadList"></div><button class="btn ghost" id="logout" type="button">Sign out</button></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),login=document.querySelector('#login'),panel=document.querySelector('#panel'),list=document.querySelector('#leadList');let leads=[];function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function state(){const {data}=await sb.auth.getSession();login.hidden=!!data.session;panel.hidden=!data.session;if(data.session)load()}document.querySelector('#loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value});document.querySelector('#msg').textContent=error?error.message:'Signed in';await state()};document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();await state()};document.querySelector('#refresh').onclick=load;document.querySelector('#search').oninput=render;document.querySelector('#statusFilter').onchange=render;async function load(){list.innerHTML='<p class="muted">Loading...</p>';const {data,error}=await sb.from('seller_leads').select('*').order('created_at',{ascending:false});if(error){list.innerHTML='<p class="muted">'+esc(error.message)+'</p>';return}leads=data||[];render()}function render(){const q=document.querySelector('#search').value.trim().toLowerCase(),sf=document.querySelector('#statusFilter').value,rows=leads.filter(x=>(!q||[x.name,x.phone,x.email,x.location,x.property_type,x.property_details].some(v=>String(v||'').toLowerCase().includes(q)))&&(!sf||x.status===sf));if(!rows.length){list.innerHTML='<p class="muted">No seller enquiries found.</p>';return}list.innerHTML=rows.map(x=>'<article class="lead-card"><div class="lead-top"><strong>'+esc(x.name)+'</strong><b>'+esc(x.status||'New')+'</b></div><div class="lead-meta">Phone: '+esc(x.phone)+(x.email?' · Email: '+esc(x.email):'')+'</div><div class="lead-meta">Property: '+esc(x.property_type||'Not specified')+' · Location: '+esc(x.location||'Not specified')+' · Expected price: '+esc(x.expected_price||'Not specified')+'</div><div class="lead-meta">Submitted: '+new Date(x.created_at).toLocaleString('en-IN')+'</div>'+(x.property_details?'<p>'+esc(x.property_details)+'</p>':'')+(Array.isArray(x.image_urls)&&x.image_urls.length?'<div class="seller-images">'+x.image_urls.map((url,i)=>'<a href="'+esc(url)+'" target="_blank" rel="noopener"><img src="'+esc(url)+'" alt="Seller property image '+(i+1)+'"></a>').join('')+'</div>':'')+'<div class="actions"><select data-status="'+x.id+'"><option '+(x.status==='New'?'selected':'')+'>New</option><option '+(x.status==='Contacted'?'selected':'')+'>Contacted</option><option '+(x.status==='Interested'?'selected':'')+'>Interested</option><option '+(x.status==='Site Visit'?'selected':'')+'>Site Visit</option><option '+(x.status==='Closed'?'selected':'')+'>Closed</option><option '+(x.status==='Not Interested'?'selected':'')+'>Not Interested</option></select><button class="btn small danger" data-delete="'+x.id+'" type="button">Delete</button></div></article>').join('');list.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{const {error}=await sb.from('seller_leads').update({status:s.value,updated_at:new Date().toISOString()}).eq('id',s.dataset.status);if(error)alert(error.message);else load()});list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this seller enquiry?'))return;const {error}=await sb.from('seller_leads').delete().eq('id',b.dataset.delete);if(error)alert(error.message);else load()})}state();</script></body></html>
