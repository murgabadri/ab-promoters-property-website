<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers | AB Promoters and Developers</title><link rel="stylesheet" href="styles.css"><style>
.customer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.customer-grid input,.customer-grid select,.customer-grid textarea{width:100%;box-sizing:border-box}.customer-grid textarea{min-height:80px}.full{grid-column:1/-1}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid #ddd;border-radius:8px}.customer-table{overflow:auto}.customer-table table{width:100%;border-collapse:collapse;min-width:1050px}.customer-table th,.customer-table td{padding:11px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}.customer-table th{background:#faf7ef}.actions{display:flex;gap:6px}.overdue{font-weight:700}.hidden{display:none!important}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}.stat{padding:12px 16px;border:1px solid #ddd;border-radius:10px;background:#fff}.stat strong{display:block;font-size:20px}
</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">AB <span>Promoters & Developers</span></a><nav><a href="admin.html">Property Admin</a></nav></div></header><main class="wrap section"><p class="eyebrow">PRIVATE ADMIN AREA</p><h1>Customer Management</h1><div id="login"><p>Sign in with your Supabase admin account.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="btn" id="loginBtn">Sign in</button><p id="msg" class="muted"></p></div><div id="panel" hidden><section><h2 id="formHeading">Add Customer</h2><form id="customerForm"><div class="customer-grid"><input name="customer_number" placeholder="Customer number e.g. CUST-001"><input name="name" placeholder="Customer name" required><input name="phone" placeholder="Contact number" required><input name="email" type="email" placeholder="Email"><input name="budget" placeholder="Budget e.g. ₹50 Lakhs"><input name="preferred_location" placeholder="Preferred location"><label>Called date<input name="called_date" type="date"></label><label>Follow-up date<input name="follow_up_date" type="date"></label><select name="status"><option value="active">Active</option><option value="follow_up">Follow-up</option><option value="interested">Interested</option><option value="site_visit">Site Visit</option><option value="closed">Closed</option><option value="not_interested">Not Interested</option></select><textarea class="full" name="notes" placeholder="Notes / requirement / discussion"></textarea></div><br><button class="btn" id="saveBtn">Save customer</button> <button class="btn ghost hidden" id="cancelBtn" type="button">Cancel edit</button><p id="result" class="muted"></p></form></section><section><h2>Customer Follow-ups</h2><div class="stats"><div class="stat"><strong id="total">0</strong>Total</div><div class="stat"><strong id="today">0</strong>Follow-ups today</div><div class="stat"><strong id="upcoming">0</strong>Upcoming</div></div><div class="toolbar"><input id="search" placeholder="Search name, phone, customer number"><input id="locationFilter" placeholder="Filter location"><select id="statusFilter"><option value="">All statuses</option><option value="active">Active</option><option value="follow_up">Follow-up</option><option value="interested">Interested</option><option value="site_visit">Site Visit</option><option value="closed">Closed</option><option value="not_interested">Not Interested</option></select></div><div class="customer-table"><table><thead><tr><th>Customer No.</th><th>Name / Contact</th><th>Budget</th><th>Location</th><th>Called</th><th>Follow-up</th><th>Status</th><th>Notes</th><th>Action</th></tr></thead><tbody id="customerRows"><tr><td colspan="9">Loading...</td></tr></tbody></table></div><br><button class="btn ghost" id="logout">Sign out</button></section></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),login=document.querySelector('#login'),panel=document.querySelector('#panel'),rows=document.querySelector('#customerRows'),form=document.querySelector('#customerForm'),result=document.querySelector('#result'),saveBtn=document.querySelector('#saveBtn'),cancelBtn=document.querySelector('#cancelBtn');let editingId=null,customers=[];
function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function reset(){editingId=null;form.reset();form.elements.status.value='active';saveBtn.textContent='Save customer';cancelBtn.classList.add('hidden');document.querySelector('#formHeading').textContent='Add Customer';result.textContent=''}function today(){return new Date().toISOString().slice(0,10)}
async function state(){const {data}=await sb.auth.getSession();login.hidden=!!data.session;panel.hidden=!data.session;if(data.session)load()}
document.querySelector('#loginBtn').onclick=async()=>{const email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value;document.querySelector('#msg').textContent='Signing in...';const {error}=await sb.auth.signInWithPassword({email,password});document.querySelector('#msg').textContent=error?error.message:'Signed in';await state()};document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();reset();await state()};cancelBtn.onclick=reset;
async function load(){const {data,error}=await sb.from('customers').select('*').order('follow_up_date',{ascending:true,nullsFirst:false}).order('created_at',{ascending:false});if(error){rows.innerHTML='<tr><td colspan="9">'+esc(error.message)+'</td></tr>';return}customers=data||[];render()}
function render(){const q=document.querySelector('#search').value.toLowerCase(),loc=document.querySelector('#locationFilter').value.toLowerCase(),st=document.querySelector('#statusFilter').value;const filtered=customers.filter(c=>(!q||[c.name,c.phone,c.customer_number].some(x=>String(x||'').toLowerCase().includes(q)))&&(!loc||String(c.preferred_location||'').toLowerCase().includes(loc))&&(!st||c.status===st));const t=today();document.querySelector('#total').textContent=customers.length;document.querySelector('#today').textContent=customers.filter(c=>c.follow_up_date===t).length;document.querySelector('#upcoming').textContent=customers.filter(c=>c.follow_up_date&&c.follow_up_date>t).length;if(!filtered.length){rows.innerHTML='<tr><td colspan="9">No customers found.</td></tr>';return}rows.innerHTML=filtered.map(c=>{const overdue=c.follow_up_date&&c.follow_up_date<t&&c.status!=='closed'&&c.status!=='not_interested';return '<tr><td>'+esc(c.customer_number||'-')+'</td><td><strong>'+esc(c.name)+'</strong><br>'+esc(c.phone)+(c.email?'<br>'+esc(c.email):'')+'</td><td>'+esc(c.budget||'-')+'</td><td>'+esc(c.preferred_location||'-')+'</td><td>'+esc(c.called_date||'-')+'</td><td class="'+(overdue?'overdue':'')+'">'+esc(c.follow_up_date||'-')+(overdue?' ⚠':'')+'</td><td>'+esc(c.status)+'</td><td>'+esc(c.notes||'-')+'</td><td><div class="actions"><button class="btn small" onclick="editCustomer(\''+c.id+'\')">Edit</button><button class="btn small danger" onclick="deleteCustomer(\''+c.id+'\')">Delete</button></div></td></tr>'}).join('')}
window.editCustomer=function(id){const c=customers.find(x=>x.id===id);if(!c)return;editingId=id;Object.keys(c).forEach(k=>{if(form.elements[k])form.elements[k].value=c[k]||''});document.querySelector('#formHeading').textContent='Edit Customer';saveBtn.textContent='Save changes';cancelBtn.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};
window.deleteCustomer=async function(id){if(!confirm('Delete this customer record?'))return;const {error}=await sb.from('customers').delete().eq('id',id);if(error){alert(error.message);return}await load()};
form.onsubmit=async e=>{e.preventDefault();saveBtn.disabled=true;result.textContent='Saving...';const f=new FormData(form);const row={customer_number:String(f.get('customer_number')||'').trim()||null,name:String(f.get('name')||'').trim(),phone:String(f.get('phone')||'').trim(),email:String(f.get('email')||'').trim()||null,budget:String(f.get('budget')||'').trim()||null,preferred_location:String(f.get('preferred_location')||'').trim()||null,called_date:f.get('called_date')||null,follow_up_date:f.get('follow_up_date')||null,status:f.get('status'),notes:String(f.get('notes')||'').trim()||null,updated_at:new Date().toISOString()};const r=editingId?await sb.from('customers').update(row).eq('id',editingId):await sb.from('customers').insert(row);if(r.error){result.textContent=r.error.message}else{result.textContent=editingId?'Customer updated successfully.':'Customer saved successfully.';reset();await load()}saveBtn.disabled=false};['search','locationFilter','statusFilter'].forEach(id=>document.querySelector('#'+id).addEventListener('input',render));document.querySelector('#statusFilter').addEventListener('change',render);state();
</script></body></html>
