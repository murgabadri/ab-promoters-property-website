<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property | AB Promoters and Developers</title><meta name="description" content="Property listing by AB Promoters and Developers."><link rel="stylesheet" href="styles.css"><style>.property-gallery{display:grid;gap:10px}.property-main-image{width:100%;max-height:520px;object-fit:cover;border-radius:12px}.property-thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.property-thumb{width:90px;height:70px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent;flex:0 0 auto}.property-thumb.active{border-color:#c8a95b}.video-section,.request-section,.nearby-section{margin-top:28px}.video-frame{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;display:block}.property-details{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.detail-box{padding:12px;border:1px solid #e2e2e2;border-radius:10px;background:#fff}.detail-box small{display:block;color:#777;margin-bottom:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.saved{background:#f7edc8!important}.request-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.request-grid .full{grid-column:1/-1}.nearby-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.nearby-card{border:1px solid #ddd;border-radius:12px;overflow:hidden;background:#fff}.nearby-card img{width:100%;height:150px;object-fit:cover}.nearby-card .body{padding:12px}.nearby-card h3{margin:4px 0}.nearby-card p{font-size:14px;color:#666}.nearby-card a{display:inline-block;margin-top:6px}.form-msg{margin-top:10px}.location-note{font-size:13px;color:#666}@media(max-width:700px){.property-details,.request-grid{grid-template-columns:1fr}.nearby-grid{grid-template-columns:1fr}.property-actions .btn{flex:1 1 45%}}@media print{header,footer,.actions,.request-section,.nearby-section,.video-section{display:none!important}body{background:#fff!important}.card{box-shadow:none!important;border:0!important}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">AB <span>Promoters & Developers</span></a><nav><a href="properties.html">All Properties</a><a class="btn small" href="https://wa.me/919786619196">WhatsApp</a></nav></div></header><main class="wrap section" id="detail"><p class="muted">Loading property…</p></main><footer><div class="wrap footer"><strong>AB Promoters and Developers</strong><span>9786619196 · 7904473899</span></div></footer><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function youtubeId(v){try{const u=new URL(String(v||'').trim());if(u.hostname.includes('youtu.be'))return u.pathname.split('/').filter(Boolean)[0]||null;if(u.hostname.includes('youtube.com')){if(u.pathname==='/watch')return u.searchParams.get('v');if(u.pathname.startsWith('/shorts/'))return u.pathname.split('/')[2]||null;if(u.pathname.startsWith('/embed/'))return u.pathname.split('/')[2]||null}}catch(_){}return null}function km(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,z=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))}function saved(id){return JSON.parse(localStorage.getItem('ab_saved_properties')||'[]').includes(id)}function toggleSave(id){let a=JSON.parse(localStorage.getItem('ab_saved_properties')||'[]');a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem('ab_saved_properties',JSON.stringify(a));const b=document.querySelector('#saveBtn');if(b){b.textContent=a.includes(id)?'★ Saved':'☆ Save';b.classList.toggle('saved',a.includes(id))}}function renderNearby(section,rows,title){if(!rows.length){section.innerHTML='<h2>Similar Properties Nearby</h2><p class="muted">No similar properties available yet.</p>';return}section.innerHTML='<h2>'+title+'</h2><div class="nearby-grid">'+rows.map(x=>{const im=Array.isArray(x.image_urls)&&x.image_urls[0]?x.image_urls[0]:'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=600&q=80';return '<article class="nearby-card"><img src="'+esc(im)+'" alt="'+esc(x.title)+'"><div class="body"><span class="tag">'+esc(x.property_type)+'</span><h3>'+esc(x.title)+'</h3><p>'+esc(x.location)+' · '+esc(x.area||x.land_area||'Area on request')+(x.distance!=null?' · '+x.distance.toFixed(1)+' km away':'')+'</p><strong>'+esc(x.price||'Price on request')+'</strong><br><a class="textlink" href="property.html?slug='+encodeURIComponent(x.slug)+'">View property →</a></div></article>'}).join('')+'</div>'}async function loadNearby(p){const section=document.querySelector('#nearby');if(!section)return;section.innerHTML='<h2>Similar Properties Nearby Me</h2><p class="muted">Finding properties near your location…</p>';const {data}=await sb.from('properties').select('*').eq('status','available').neq('id',p.id).not('latitude','is',null).not('longitude','is',null).limit(100);const all=data||[];const finish=(lat,lon)=>{const rows=all.map(x=>({...x,distance:km(lat,lon,Number(x.latitude),Number(x.longitude))})).filter(x=>x.distance<=25).sort((a,b)=>a.distance-b.distance).slice(0,6);if(rows.length)renderNearby(section,rows,'Similar Properties Near Me');else fallback()};const fallback=async()=>{const {data:d}=await sb.from('properties').select('*').eq('status','available').eq('location',p.location).neq('id',p.id).limit(6);renderNearby(section,(d||[]).map(x=>({...x,distance:null})),'Similar Properties Nearby')};if(!navigator.geolocation){fallback();return}navigator.geolocation.getCurrentPosition(pos=>finish(pos.coords.latitude,pos.coords.longitude),()=>fallback(),{enableHighAccuracy:false,timeout:8000,maximumAge:300000})}async function load(){const slug=new URLSearchParams(location.search).get('slug');const {data:p,error}=await sb.from('properties').select('*').eq('slug',slug).eq('status','available').maybeSingle();if(error||!p){detail.innerHTML='<h1>Property not found</h1><a class="btn" href="properties.html">Browse properties</a>';return}document.title=p.title+' | AB Promoters and Developers';const images=Array.isArray(p.image_urls)&&p.image_urls.length?p.image_urls:['https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1200&q=80'];const videoId=youtubeId(p.youtube_url),videoHtml=videoId?'<section class="video-section"><h2>Property Video</h2><iframe class="video-frame" src="https://www.youtube.com/embed/'+encodeURIComponent(videoId)+'" title="'+esc(p.title)+' property video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></section>':'';const google=p.google_location?'<a class="btn ghost" style="color:#19352b;border-color:#19352b" target="_blank" rel="noopener" href="'+esc(p.google_location)+'">📍 Google Location</a>':'';detail.innerHTML='<p class="eyebrow">'+esc(p.property_type)+' · '+esc(p.location)+'</p><h1>'+esc(p.title)+'</h1><div class="card" style="max-width:900px"><div class="card-body"><div class="property-gallery"><img id="mainPropertyImage" class="property-main-image" src="'+esc(images[0])+'" alt="'+esc(p.title)+'">'+(images.length>1?'<div class="property-thumbs">'+images.map((url,i)=>'<img class="property-thumb '+(i===0?'active':'')+'" src="'+esc(url)+'" alt="'+esc(p.title)+' image '+(i+1)+'" data-image="'+esc(url)+'">').join('')+'</div>':'')+'</div></div><div class="card-body"><div class="property-details"><div class="detail-box"><small>Property Type</small><b>'+esc(p.property_type)+'</b></div><div class="detail-box"><small>Sale Details</small><b>'+esc(p.sale_details||'Available for sale')+'</b></div><div class="detail-box"><small>Area</small><b>'+esc(p.area||'On request')+'</b></div><div class="detail-box"><small>Land Area</small><b>'+esc(p.land_area||'On request')+'</b></div><div class="detail-box"><small>FMB</small><b>'+((p.fmb_available)?'Available':'Not specified')+'</b></div><div class="detail-box"><small>Sale Price</small><b>'+esc(p.price||'On request')+'</b></div><div class="detail-box"><small>Price Negotiable</small><b>'+((p.price_negotiable!==false)?'Yes':'No')+'</b></div><div class="detail-box"><small>Location</small><b>'+esc(p.location)+'</b></div></div><p>'+esc(p.description||'Contact us for complete property details.')+'</p><div class="actions property-actions"><button class="btn" id="shareBtn" type="button">↗ Share</button><button class="btn" id="printBtn" type="button">🖨 Print</button><button class="btn" id="saveBtn" type="button">'+(saved(p.id)?'★ Saved':'☆ Save')+'</button>'+google+'<a class="btn" href="https://wa.me/919786619196?text='+encodeURIComponent('I am interested in '+p.title)+'">WhatsApp</a><a class="btn ghost" style="color:#19352b;border-color:#19352b" href="tel:+919786619196">Call</a></div></div></div>'+videoHtml+'<section class="request-section"><h2>Customer Request</h2><p class="lead">Interested in this property? Send your requirement and our team will contact you.</p><form id="requestForm"><div class="request-grid"><input name="name" placeholder="Your name" required><input name="phone" type="tel" placeholder="Contact number" required><input name="email" type="email" placeholder="Email address"><input name="preferred_budget" placeholder="Your budget"><input name="preferred_location" placeholder="Preferred location"><input name="message" class="full" placeholder="Message / requirement"><button class="btn full" id="requestBtn" type="submit">Send Request</button></div><p id="requestMsg" class="form-msg muted"></p></form></section><section id="nearby" class="nearby-section"></section>';document.querySelectorAll('.property-thumb').forEach(t=>t.onclick=()=>{document.querySelector('#mainPropertyImage').src=t.dataset.image;document.querySelectorAll('.property-thumb').forEach(x=>x.classList.remove('active'));t.classList.add('active')});document.querySelector('#shareBtn').onclick=async()=>{try{if(navigator.share)await navigator.share({title:p.title,text:'Check this property: '+p.title,url:location.href});else{await navigator.clipboard.writeText(location.href);alert('Property link copied.')}}catch(e){}};document.querySelector('#printBtn').onclick=()=>window.print();document.querySelector('#saveBtn').onclick=()=>toggleSave(p.id);document.querySelector('#requestForm').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('#requestBtn'),m=document.querySelector('#requestMsg');b.disabled=true;b.textContent='Sending...';const f=new FormData(e.target),row={property_id:p.id,name:f.get('name'),phone:f.get('phone'),email:f.get('email'),preferred_budget:f.get('preferred_budget'),preferred_location:f.get('preferred_location'),message:f.get('message'),customer_type:'Property Request'};const {error}=await sb.from('property_leads').insert(row);m.textContent=error?'Unable to send request. Please call us directly.':'Request sent successfully. Our team will contact you soon.';if(!error)e.target.reset();b.disabled=false;b.textContent='Send Request'};loadNearby(p)}load();</script></body></html>
